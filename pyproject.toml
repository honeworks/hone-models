[project]
name = "hone-models"
dynamic = ["version"]
description = "One interface for local and hosted AI models, with structured output, GPU scheduling and full call records."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Bahman Shadmehr", email = "info@bshadmehr.me" }]
keywords = ["ai", "llm", "generative-ai", "ollama", "structured-output", "gpu", "text-to-speech", "tracing", "honeworks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "rich>=13.7"]
gpu = ["nvidia-ml-py>=12"]
litellm = ["litellm>=1.40"]
jev = []
# local text to speech (Kokoro-82M, Apache-2.0); the kokoro package supports Python < 3.13 only
speech = ["kokoro>=0.9.4; python_version < '3.13'"]
# expressive text to speech (Chatterbox, MIT) with emotion / intensity control; see [tool.uv] below
expressive = [
    "chatterbox-tts>=0.1.7; python_version < '3.13'",
    # its watermarker (resemble-perth) imports pkg_resources, which setuptools 81 removed
    "setuptools>=70,<81; python_version < '3.13'",
]

[dependency-groups]
# Development only (never published; `uv sync` installs it by default).
dev = [
    "pytest>=8", "pytest-cov>=5", "pytest-timeout>=2.3", "hypothesis>=6.100",
    "respx>=0.21", "ruff>=0.6", "pyright>=1.1.380",
    # contract checkers from the packages that own the ports (design/current.md §10)
    "hone-flow>=0.1", "hone-lens>=0.1",  # hone-select's checkers: tests/select_contracts.py
    # spaCy's English model, which Kokoro's phonemizer needs and PyPI cannot carry as a dependency
    # (a direct URL); users add the same line (docs/speech.md, change 0008).
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl ; python_version < '3.13'",
]

[project.urls]
Homepage = "https://github.com/honeworks/hone-models"
Repository = "https://github.com/honeworks/hone-models"
Issues = "https://github.com/honeworks/hone-models/issues"
Documentation = "https://github.com/honeworks/hone-models/tree/main/docs"
Changelog = "https://github.com/honeworks/hone-models/blob/main/CHANGELOG.md"

[project.scripts]
hone-models = "hone_models.cli:main"

[project.entry-points."hone.decision_clients"]
hone_models = "hone_models:decision"

[project.entry-points."hone.text_clients"]
hone_models = "hone_models:text"

[project.entry-points."hone.embedders"]
hone_models = "hone_models:embedder"

[project.entry-points."hone.image_clients"]
hone_models = "hone_models:image"

[project.entry-points."hone.music_clients"]
hone_models = "hone_models:music"

[project.entry-points."hone.video_clients"]
hone_models = "hone_models:video"

[project.entry-points."hone.model_guides"]
hone_models = "hone_models:guide"

[project.entry-points."hone.gpu_leases"]
hone_models = "hone_models.gpu:GPU"

[project.entry-points."hone.replayers"]
hone_models = "hone_models.replay:Replayer"

[project.entry-points."hone.machine_probes"]
hone_models = "hone_models.machine:Machine"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/hone_models/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hone_models"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "examples/", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "CHANGELOG.md", "pyproject.toml"]
exclude = [".hone/"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "S", "C4", "DTZ", "PL", "C90"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "PLR0915", "N802"]
"examples/**" = ["S101", "S603"]  # examples assert their key facts (design/current.md §12); calls_cli.py runs the CLI
"src/hone_models/testing/contracts.py" = ["S101", "PT018"]  # contract check written with plain asserts

[tool.uv.sources]
# Sibling packages, for the dev group only (design/decisions.md D-016); remove once they are on PyPI.
hone-flow = { git = "https://github.com/honeworks/hone-flow", branch = "main" }
hone-lens = { git = "https://github.com/honeworks/hone-lens", branch = "main" }

[tool.uv]
# Local development only (not published): keep torch within the range the speech extras are tested on.
constraint-dependencies = ["torch>=2.6,<2.11"]
# chatterbox-tts pins torch / torchaudio 2.6.0 and numpy < 2 exactly; it runs on newer builds
# (design/decisions.md D-021). Overrides replace those pins; apps using the `expressive` extra copy them.
override-dependencies = ["torch>=2.6,<2.11", "torchaudio>=2.6,<2.11", "numpy>=1.24"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers -m 'not gpu and not ollama and not comfyui and not hosted'"
timeout = 120
markers = [
    "e2e: acceptance-case tests (run by default)",
    "gpu: needs the shared GPU; run via scripts/gpu-lock.sh",
    "ollama: needs a running Ollama",
    "comfyui: needs ComfyUI",
    "hosted: needs a hosted API key",
    "slow: slower than 5 s",
]

[tool.coverage.run]
branch = true
source = ["src/hone_models"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload", "\\.\\.\\."]
