[models."gpt-4.1-mini"]
provider = "openai_compatible"
kind = "chat"
model = "gpt-4.1-mini"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
[models."gpt-4.1-mini".capabilities]
vision = true
json_schema = true
logprobs = true
max_input_tokens = 1047576
max_output_tokens = 32768
price = { input_per_mtok = 0.4, output_per_mtok = 1.6 }
license = "OpenAI service terms (hosted)"
commercial_use = true
[models."gpt-4.1-mini".install]
source = "https://platform.openai.com/docs/models/gpt-4.1-mini"
note = "hosted: nothing to install; set OPENAI_API_KEY"
[models."gpt-4.1-mini".guide]
summary = "Hosted general model with vision, structured output and logprobs; cheap."
prompt = "Plain instructions; structured output through a JSON schema."
source = "https://platform.openai.com/docs/models/gpt-4.1-mini"
checked = 2026-09-29

