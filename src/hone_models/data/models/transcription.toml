# Packaged catalog: transcription (change 0015 §3b). Provider `faster_whisper` (extra `transcribe`).

[models."faster-whisper-large-v3-turbo"]
provider = "faster_whisper"
kind = "transcription"
model = "deepdml/faster-whisper-large-v3-turbo-ct2"
defaults = { compute_type = "float16", beam_size = 5 }
[models."faster-whisper-large-v3-turbo".capabilities]
word_timestamps = true
vram_gb = 2.0
license = "MIT"
commercial_use = true
[models."faster-whisper-large-v3-turbo".install]
source = "https://huggingface.co/deepdml/faster-whisper-large-v3-turbo-ct2"
hf = "deepdml/faster-whisper-large-v3-turbo-ct2"
size_gb = 1.6
tier = 1
note = "lyric timing and intelligibility: word timestamps, fast"
[models."faster-whisper-large-v3-turbo".guide]
summary = "Fast Whisper large-v3-turbo transcription with word timestamps."
prompt = "Pass the known lyrics or script as `prompt` to bias the words; set `language` when known."
source = "https://github.com/SYSTRAN/faster-whisper"
checked = 2026-09-29

