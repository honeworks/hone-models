[models."cat-project"]
provider = "command"
kind = "music"
command = ["$HONE_CAT_PROJECT/.venv/bin/python", "run.py", "{request}"]
[models."cat-project".install]
repo = "https://example.org/cat-project.git"
setup = ["python3 -m venv .venv", ".venv/bin/pip install -r requirements.txt"]
dir_env = "HONE_CAT_PROJECT"
check = "test -f ready.txt"
size_gb = 3.0

[models."cat-scorer"]
