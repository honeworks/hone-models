[models."songgeneration-v2-medium"]
provider = "command"
kind = "music"
command = ["$HONE_LEVO2_DIR/.venv/bin/python", "{adapter:levo2}", "{request}"]
cwd = "$HONE_LEVO2_DIR"
inputs = ["generate_type"]                         # mixed | vocal | bgm | separate
defaults = { generate_type = "mixed", low_mem = true }
lyrics_format = "levo"
[models."songgeneration-v2-medium".capabilities]
max_duration_s = 270
vram_gb = 7.5
license = "SongGeneration license terms (academic, research and education use only)"
commercial_use = false
[models."songgeneration-v2-medium".install]
source = "https://github.com/tencent-ailab/SongGeneration"
repo = "https://github.com/tencent-ailab/SongGeneration"
setup = [
  "python3.10 -m venv .venv",
  ".venv/bin/pip install -r requirements.txt",
  ".venv/bin/pip install -r requirements_nodeps.txt --no-deps",
  "hf download lglg666/SongGeneration-Runtime --local-dir runtime",
  "mv runtime/ckpt ckpt && mv runtime/third_party third_party",
  "hf download lglg666/SongGeneration-v2-medium --local-dir songgeneration_v2_medium",
]
dir_env = "HONE_LEVO2_DIR"
check = "test -x .venv/bin/python -a -f songgeneration_v2_medium/model.pt"
size_gb = 22.4
tier = 1
note = "Tencent LeVo 2 medium: strong lyric accuracy; its own Python 3.10 environment, run with --low_mem on 8 GB"
[models."songgeneration-v2-medium".guide]
summary = "Full songs with vocals up to 4.5 minutes and precise lyrics (LeVo 2); non-commercial."
prompt = "A description with gender, genre, emotion and instruments (e.g. 'female, dark, hip hop, sad, piano and drums')."
inputs = { generate_type = "'mixed' (song), 'vocal' (a cappella), 'bgm' (instrumental) or 'separate' (vocal and accompaniment tracks)", lyrics = "the common format; converted to LeVo's '[verse] line. line. ; [chorus] ...' form" }
source = "https://github.com/tencent-ailab/SongGeneration"
checked = 2026-09-29
[[models."songgeneration-v2-medium".guide.features]]
