# Packaged catalog: image generation and editing (change 0015 §3b). A ComfyUI entry has a `workflow` (API
# format, relative to hone_models/data/) and an `inputs` table once the workflow is written and proven with
# `hone-models models check <id>` (every model installed on the reference machine has one, D-070); until
# then calling it says the workflow is missing. `vram_gb` is the peak measured by that check, or set near
# the whole card on purpose where a comment says so. `sizes` lists the sizes used on the reference
# machine (D-081); `guide.notes` say how a model behaves per situation, each with its evidence (0020).
# `install.files` go to <HONE_COMFYUI_DIR or ~/ComfyUI>/models/<to>.

[models."z-image-turbo"]
provider = "comfyui"
kind = "image"
workflow = "workflows/z-image-turbo.json"
outputs = ["9"]
defaults = { size = "1024x1024", steps = 8 }
[models."z-image-turbo".inputs]
prompt = "27.text"
seed = "3.seed"
steps = "3.steps"
width = "13.width"
height = "13.height"
[models."z-image-turbo".capabilities]
vram_gb = 6.3
max_references = 0
license = "Apache-2.0"
commercial_use = true
pose = "none"
sizes = ["256x256", "512x512", "768x768", "1024x1024", "1328x1328", "1024x576", "576x1024", "1280x720", "720x1280", "1344x768", "768x1344", "1664x928", "928x1664", "1024x768", "768x1024", "1152x864", "864x1152", "1216x832", "832x1216", "1536x1024", "1024x1536", "1152x896", "896x1152", "704x880", "832x1248", "1536x640", "640x1536", "2048x1024"]
[models."z-image-turbo".install]
source = "https://huggingface.co/Tongyi-MAI/Z-Image-Turbo"
files = [
  { repo = "Comfy-Org/z_image_turbo", file = "split_files/diffusion_models/z_image_turbo_bf16.safetensors", to = "diffusion_models" },
  { repo = "Comfy-Org/z_image_turbo", file = "split_files/text_encoders/qwen_3_4b.safetensors", to = "text_encoders" },
  { repo = "Comfy-Org/z_image_turbo", file = "split_files/vae/ae.safetensors", to = "vae" },
]
size_gb = 20.7
tier = 1
note = "the old app's model: a fast baseline"
[models."z-image-turbo".guide]
summary = "Fast photorealistic text-to-image in 8 steps; renders English and Chinese text."
prompt = "Detailed natural-language description: subject, clothing, setting, light, camera; no negative prompt (guidance 0)."
source = "https://huggingface.co/Tongyi-MAI/Z-Image-Turbo"
checked = 2026-10-13
[[models."z-image-turbo".guide.features]]
name = "text in images"
how = "Write the text in quotes in the prompt and say where it goes."
examples = ["a shop sign that reads \"OPEN LATE\" above the door"]
source = "https://huggingface.co/Tongyi-MAI/Z-Image-Turbo"
[[models."z-image-turbo".guide.notes]]
about = "general"
says = "Its guides ask for long, structured prompts of 80 to 250 words: shot, subject, clothing and colours, background, light, style. Write plain sentences: a tag list did worse than no detail at all, and a period label alone barely changed the picture."
source = "hone-frame/design/research/prompting-findings.md"
checked = 2026-10-03
[[models."z-image-turbo".guide.notes]]
about = "general"
says = "There is no negative prompt: write every constraint as a positive sentence (\"the background is plain white\"); \"no cape\" written in the prompt tends to draw a cape."
source = "hone-frame/design/changes/0002-prompt-dialects.md; hone-frame/design/decisions.md D-034"
checked = 2026-10-03
[[models."z-image-turbo".guide.notes]]
about = "general"
says = "It is distilled: new seeds give near-identical pictures for one prompt. For different candidates, vary what the prompt leaves open (face shape, build, how a garment is worn)."
source = "hone-frame/design/decisions.md D-037"
checked = 2026-10-03
[[models."z-image-turbo".guide.notes]]
about = "general"
says = "Put the style words at the start and again at the end: a flat 2D look held only when the prompt opened and closed with the 2D wording."
source = "hone-frame/design/changes/0002-prompt-dialects.md; hone-frame/src/hone_frame/data/prompting.toml (before 0008)"
checked = 2026-10-02
[[models."z-image-turbo".guide.notes]]
about = "people"
says = "Spell out what is worn (\"a lamellar coat laced with red cord, a conical helmet with a mail curtain\"): from a culture or period name alone it drew Western costume."
source = "hone-frame/design/research/prompting-findings.md"
checked = 2026-10-03
[[models."z-image-turbo".guide.notes]]
about = "poses"
says = "To draw a mannequin for a pose picture, describe the body only: \"raising the mace overhead\" drew the mannequin holding a hammer despite \"empty hands, holding nothing\". (Seen in a hone-frame run whose model was not recorded; most likely this one.)"
source = "hone-frame/design/changes/0007-quality-pipeline.md"
checked = 2026-10-04
[[models."z-image-turbo".guide.notes]]
about = "poses"
says = "From text alone it follows full-body poses less well than flux.2-klein-4b-text: lying came out sitting, crouching and kneeling on one knee near standing, and it often added a display stand. It did not turn the head to look back over the shoulder, nor draw a true lunge."
source = "hone-frame mannequin library generation, 2026-10-13 (pose-first prompts, three seeds per model)"
checked = 2026-10-13
[[models."z-image-turbo".guide.notes]]
about = "references"
says = "It takes no reference pictures; to keep a character or an object from a picture, use an editing model."
source = "hone-music-video/experiments/issues.md"
checked = 2026-10-13
[[models."z-image-turbo".guide.notes]]
about = "text"
says = "It renders English and Chinese text: quote the words and say where they go."
source = "https://huggingface.co/Tongyi-MAI/Z-Image-Turbo"
checked = 2026-09-29
[[models."z-image-turbo".guide.notes]]
about = "sizes"
says = "Run on the 8 GB card at 1024x1024, at 2048x1024 for a row of four full figures and at 1024x576 for 16:9 frames; the 9:16, 1:1 and 4:5 frame sizes were never run, and the other declared sizes are allowed but unproven."
source = "hone-frame/src/hone_frame/data/presets/profile.toml; hone-music-video/design/decisions.md D-023, D-030"
checked = 2026-10-10

# FLUX.2 klein 4B with references (hone-frame's proven workflow, its D-016): two reference slots, both
# needed by the graph (each feeds a VAEEncode and a ReferenceLatent), so one reference is given twice
# (`empty_slots`, hone-frame D-017). `vram_gb` is near the whole card on purpose: the GPU scheduler then
# unloads a planner or judge first (hone-frame's measured out-of-memory without it).
[models."flux.2-klein-4b"]
provider = "comfyui"
kind = "image"
workflow = "workflows/flux.2-klein-4b.json"
outputs = ["27"]
defaults = { size = "1024x1024", steps = 4 }
max_timeout_s = 1800.0
empty_slots = "repeat_last"
[models."flux.2-klein-4b".inputs]
prompt = "4.text"
seed = "23.noise_seed"
steps = "21.steps"
references = ["11.image", "13.image"]
width = ["20.width", "21.width"]
height = ["20.height", "21.height"]
[models."flux.2-klein-4b".capabilities]
vram_gb = 7.2
max_references = 2
license = "Apache-2.0"
commercial_use = true
pose = "reference"
sizes = ["256x256", "512x512", "768x768", "1024x1024", "1328x1328", "1024x576", "576x1024", "1280x720", "720x1280", "1344x768", "768x1344", "1664x928", "928x1664", "1024x768", "768x1024", "1152x864", "864x1152", "1216x832", "832x1216", "1536x1024", "1024x1536", "1152x896", "896x1152", "704x880", "832x1248", "1536x640", "640x1536", "2048x1024"]
[models."flux.2-klein-4b".install]
source = "https://huggingface.co/black-forest-labs/FLUX.2-klein-4B"
files = [
  { repo = "Comfy-Org/vae-text-encorder-for-flux-klein-4b", file = "split_files/diffusion_models/flux-2-klein-4b.safetensors", to = "diffusion_models" },
  { repo = "Comfy-Org/vae-text-encorder-for-flux-klein-4b", file = "split_files/text_encoders/qwen_3_4b.safetensors", to = "text_encoders" },
  { repo = "Comfy-Org/vae-text-encorder-for-flux-klein-4b", file = "split_files/vae/flux2-vae.safetensors", to = "vae" },
]
size_gb = 16.1
tier = 1
note = "generation and reference editing in one small model; fits the GPU (shares qwen_3_4b with z-image-turbo)"
[models."flux.2-klein-4b".guide]
summary = "Small FLUX.2 editing from one or two reference images, 4 steps; flux.2-klein-4b-text draws from the prompt alone."
prompt = "Natural-language description, subject first; for edits say what to change and what to keep from each reference."
source = "https://huggingface.co/black-forest-labs/FLUX.2-klein-4B"
checked = 2026-10-13
[[models."flux.2-klein-4b".guide.features]]
name = "reference editing"
how = "Give one or more reference images and describe the change; the model keeps what the prompt does not change."
input = "references"
examples = ["the woman from image 1 wearing the jacket from image 2, same pose"]
source = "https://huggingface.co/black-forest-labs/FLUX.2-klein-4B"
[[models."flux.2-klein-4b".guide.notes]]
about = "general"
says = "Keep prompts to about 40 to 120 words with the subject first: the model weighs the first words most, and its guides say prompts over 100 words confuse it. Write sentences, not tags; hone-frame kept an edit of one reference to 110 words and a composition of several to 120."
source = "hone-frame/design/changes/0002-prompt-dialects.md; hone-frame/design/research/prompting-findings.md; hone-frame/src/hone_frame/data/prompting.toml (before 0008)"
checked = 2026-10-02
[[models."flux.2-klein-4b".guide.notes]]
about = "general"
says = "There is no negative prompt: write every constraint as a positive sentence, since \"no cape\" written in the prompt tends to draw a cape."
source = "hone-frame/design/decisions.md D-034"
checked = 2026-10-03
[[models."flux.2-klein-4b".guide.notes]]
about = "faces"
says = "Tiny face marks (a mole, a small scar) move between edits, from cheek to chin to forehead; give an exact position and size and check the result. (Seen in a hone-frame run whose model was not recorded; most likely this one.)"
source = "hone-frame/design/research/prompting-findings.md"
checked = 2026-10-03
[[models."flux.2-klein-4b".guide.notes]]
about = "people"
says = "In every edit say who the person is (\"a young woman of about twenty\", \"a beard reaching the chest\"): with only \"the same face as image 1\" beards changed length and a woman in armour got a moustache."
source = "hone-frame/design/research/root-causes-2026-10-03.md"
checked = 2026-10-03
[[models."flux.2-klein-4b".guide.notes]]
about = "people"
says = "For another view of the same person, state the change first (\"the same man, turned around, seen from behind\") and leave out what the view cannot show: a long prompt that opened with the style and re-described the face drew the back view facing the camera."
source = "hone-frame/design/changes/0002-prompt-dialects.md"
checked = 2026-10-02
[[models."flux.2-klein-4b".guide.notes]]
about = "people"
says = "Left and right flip when a pose turns: an armlet moved between arms and down to the wrists. (Seen in a hone-frame run whose model was not recorded; most likely this one.)"
source = "hone-frame/design/research/prompting-findings.md"
checked = 2026-10-03
[[models."flux.2-klein-4b".guide.notes]]
about = "poses"
says = "An edit keeps the pose of its reference: with text alone \"running\" became a hop, \"seated\" a crouch and \"kneeling\" half-standing. A plain wooden mannequin in the pose as image 2 (\"in exactly the body pose of the wooden mannequin in image 2\") fixed kneeling, running, sitting and a fighting stance."
source = "hone-frame/design/research/prompting-findings.md"
checked = 2026-10-03
[[models."flux.2-klein-4b".guide.notes]]
about = "poses"
says = "With a mannequin as the pose, a 2D figure came out slightly slimmer and more 3D-looking. In a side view a foot came out turned backwards; ask side views for the feet to turn with the body. (Seen in a hone-frame run whose model was not recorded; most likely this one.)"
source = "hone-frame/design/research/prompting-findings.md; hone-frame/design/decisions.md D-029"
checked = 2026-10-03
[[models."flux.2-klein-4b".guide.notes]]
about = "objects"
says = "Asked to turn an object (a mace) it returned near-copies of the reference; flat objects (a bow, a coiled lasso) look the same from front, back and side. For a real turn use qwen-image-edit-2511 with its camera phrase."
source = "hone-frame/design/changes/0007-quality-pipeline.md; hone-frame/design/research/prompting-findings.md"
checked = 2026-10-04
[[models."flux.2-klein-4b".guide.notes]]
about = "objects"
says = "A top view failed from a side-on reference (of a horse) and from a three-quarter one; it failed on qwen-image-edit-2511 too."
source = "hone-frame/design/research/prompting-findings.md; hone-frame/design/changes/0007-quality-pipeline.md"
checked = 2026-10-04
[[models."flux.2-klein-4b".guide.notes]]
about = "places"
says = "Tell a view of a place to keep the place (\"the same place, buildings, materials and colours\"): one asked to keep \"the same face, hair, build, clothes\" came out as a man's portrait in front of the fortress. (Seen in a hone-frame run whose model was not recorded; most likely this one.)"
source = "hone-frame/design/decisions.md D-040"
checked = 2026-10-03
[[models."flux.2-klein-4b".guide.notes]]
about = "scenes"
says = "Never drop the sentence that says which reference is whom (\"image 1 is Rostam, image 2 is the mace\"): without it a sword nobody asked for appeared and a woman became \"he\"."
source = "hone-frame/design/research/root-causes-2026-10-03.md"
checked = 2026-10-03
[[models."flux.2-klein-4b".guide.notes]]
about = "references"
says = "Call the references \"image 1\" and \"image 2\". The workflow needs both slots filled, so a single reference is given twice; with none, use flux.2-klein-4b-text."
source = "hone-frame/design/decisions.md D-017"
checked = 2026-10-02
[[models."flux.2-klein-4b".guide.notes]]
about = "sizes"
says = "Run at 1024x1024 on the 8 GB card, about 30 s a picture; the other declared sizes are allowed but unproven."
source = "hone-frame/design/changes/0007-quality-pipeline.md"
checked = 2026-10-04

