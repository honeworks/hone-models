# Packaged catalog: chat models (change 0015 §3b). One file per kind in this folder; an id is in one file.
# Override or extend in ~/.config/hone/models.toml, ./hone-models.toml or files passed to
# hone_models.registry.load(paths=[...]). Being installed is checked on the machine
# (`hone-models models list --installed`), never claimed here. Ollama names are the `hf.co/...:Q4_K_M` tags
# or the Ollama library tags; tier: 1 test first, 2 worth a try, 3 to learn the ceiling.

# --- the original defaults -----------------------------------------------------------------------

[models."gemma4-12b"]
provider = "ollama"
kind = "chat"
model = "gemma4-12b:latest"
defaults = { temperature = 0.8 }
[models."gemma4-12b".capabilities]
vision = false
thinking = true            # send think=false unless the caller asks for reasoning
json_schema = true         # Ollama format=<schema>
logprobs = false
max_input_tokens = 32768
max_output_tokens = 8192
vram_gb = 7.4
license = "Apache-2.0"
commercial_use = true
[models."gemma4-12b".install]
source = "https://huggingface.co/google/gemma-4-12B-it"
ollama = "gemma4:12b"
size_gb = 7.4
tier = 1
note = "the old app's writer: the floor to beat; `gemma4-12b:latest` is a local tag of the same weights"
[models."gemma4-12b".guide]
summary = "General 12B model that fits the 8 GB GPU; the baseline writer the fine-tunes are compared with."
prompt = "Plain instructions; give the output format explicitly. Thinking is off unless asked for."
source = "https://huggingface.co/google/gemma-4-12B-it"
checked = 2026-09-29

[models."qwen2.5vl-7b"]
provider = "ollama"
kind = "chat"
model = "qwen2.5vl:7b"
[models."qwen2.5vl-7b".capabilities]
vision = true
image_patch_px = 28        # one prompt token per 28x28 pixels
json_schema = true
max_input_tokens = 32768
vram_gb = 6.0
license = "Apache-2.0"
commercial_use = true
[models."qwen2.5vl-7b".install]
source = "https://ollama.com/library/qwen2.5vl"
ollama = "qwen2.5vl:7b"
size_gb = 6.0
tier = 1
note = "vision model that fits the GPU: describes and checks images"
[models."qwen2.5vl-7b".guide]
summary = "Vision-language model: describes, compares and checks images; fits the 8 GB GPU."
prompt = "Attach the images and ask one concrete question per image; ask for JSON when you need fields."
source = "https://huggingface.co/Qwen/Qwen2.5-VL-7B-Instruct"
checked = 2026-09-29

[models."deepseek-r1-8b"]
provider = "ollama"
kind = "chat"
model = "deepseek-r1:8b"
[models."deepseek-r1-8b".capabilities]
vision = false
thinking = true
json_schema = true
max_input_tokens = 32768
