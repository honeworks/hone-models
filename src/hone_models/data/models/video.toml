# Packaged catalog: video (change 0015 §3b). ComfyUI entries get `workflow` and `inputs` when the workflow is
# proven (`hone-models models check`). Wan and LTX count frames: an `inputs` mapping converts seconds
# (`{ path = "<node>.length", per_second = 16, add = 1 }`).

[models."wan2.2-i2v-14b"]
provider = "comfyui"
kind = "video"
[models."wan2.2-i2v-14b".capabilities]
max_duration_s = 5
license = "Apache-2.0"
commercial_use = true
[models."wan2.2-i2v-14b".install]
source = "https://huggingface.co/Wan-AI/Wan2.2-I2V-A14B"
files = [
  { repo = "Comfy-Org/Wan_2.2_ComfyUI_Repackaged", file = "split_files/diffusion_models/wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors", to = "diffusion_models" },
  { repo = "Comfy-Org/Wan_2.2_ComfyUI_Repackaged", file = "split_files/diffusion_models/wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors", to = "diffusion_models" },
  { repo = "Comfy-Org/Wan_2.2_ComfyUI_Repackaged", file = "split_files/loras/wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors", to = "loras" },
  { repo = "Comfy-Org/Wan_2.2_ComfyUI_Repackaged", file = "split_files/loras/wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors", to = "loras" },
  { repo = "Comfy-Org/Wan_2.2_ComfyUI_Repackaged", file = "split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors", to = "text_encoders" },
  { repo = "Comfy-Org/Wan_2.2_ComfyUI_Repackaged", file = "split_files/vae/wan_2.1_vae.safetensors", to = "vae" },
]
size_gb = 38.0
tier = 1
note = "image to video, 4 steps with the lightx2v LoRAs; the two 14 GB experts are offloaded to RAM (do not run two such jobs at once)"
[models."wan2.2-i2v-14b".guide]
summary = "Animates a start frame into a short clip (about 5 s at 16 fps); strong motion and camera moves."
prompt = "Describe the motion and the camera, not the picture: 'slow push-in, candle flicker, hair moves in the wind'."
source = "https://huggingface.co/Wan-AI/Wan2.2-I2V-A14B"
checked = 2026-09-29
[[models."wan2.2-i2v-14b".guide.features]]
name = "camera motion"
how = "Name the camera move in the prompt."
input = "image"
examples = ["slow push-in", "orbit left around the subject", "handheld tracking shot"]
source = "https://huggingface.co/Wan-AI/Wan2.2-I2V-A14B"

