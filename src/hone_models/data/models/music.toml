# Packaged catalog: music and songs (change 0015 §3b). `lyrics_format` names how the common lyrics format
# (section tags on their own line, one sung line per line) is converted for the model (formats.py).
# ComfyUI entries have `workflow` and `inputs` once the workflow is proven (`hone-models models check`,
# D-070); `vram_gb` is the peak that check measured.

[models."ace-step-1.5-turbo"]
provider = "comfyui"
kind = "music"
workflow = "workflows/ace-step-1.5-turbo.json"
outputs = ["111"]
defaults = { duration_s = 120, steps = 8 }
lyrics_format = "sections"
[models."ace-step-1.5-turbo".inputs]
prompt = "94.tags"
lyrics = "94.lyrics"
seed = "109.value"
steps = "3.steps"
duration_s = ["94.duration", "98.seconds"]
bpm = "94.bpm"
key = "94.keyscale"
time_signature = "94.timesignature"
language = "94.language"
[models."ace-step-1.5-turbo".capabilities]
vram_gb = 6.4
max_duration_s = 600
license = "MIT"
commercial_use = true
[models."ace-step-1.5-turbo".install]
