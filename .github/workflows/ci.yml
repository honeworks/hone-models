name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # The light extras only: the speech extras (torch, CUDA wheels) are several GB. Their tests use
    # FakeSpeech or skip without torch; the `speech-import` job below checks that they install and import.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python: ["3.11", "3.12", "3.13"] }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with: { python-version: "${{ matrix.python }}", enable-cache: true }
      - run: uv sync --locked --extra cli --extra gpu --extra litellm
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      # default suite: the gpu / ollama / comfyui / hosted markers are deselected in pyproject.toml
      - run: uv run pytest --cov --cov-fail-under=90
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - name: Smoke test the wheel in a clean env (no extras)
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          uv pip install --python "$RUNNER_TEMP/smoke/bin/python" dist/*.whl
          "$RUNNER_TEMP/smoke/bin/python" -c "import hone_models; print(hone_models.__version__)"
          "$RUNNER_TEMP/smoke/bin/python" tests/smoke_quickstart.py
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }
  speech-import:
    # Import-only smoke test of the heavy speech extras (CPU torch; no model download, no synthesis).
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with: { python-version: "3.12" }
      - name: Install the speech extras with CPU-only torch
        run: |
          uv venv "$RUNNER_TEMP/speech"
          uv pip install --python "$RUNNER_TEMP/speech/bin/python" \
            --index-strategy unsafe-best-match --extra-index-url https://download.pytorch.org/whl/cpu \
            --override <(printf 'torch>=2.6,<2.11\ntorchaudio>=2.6,<2.11\nnumpy>=1.24\n') \
            ".[speech,expressive]"
      - name: Import them
        run: |
          "$RUNNER_TEMP/speech/bin/python" -c "import kokoro, chatterbox, hone_models as mk; \
          print(mk.speech('kokoro-82m'), mk.speech('chatterbox'))"
