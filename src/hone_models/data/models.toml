# Packaged default registry. Override or extend in ~/.config/hone/models.toml,
# ./hone-models.toml or explicit files passed to hone_models.registry.load(paths=[...]).

[models."gemma4-12b"]
provider = "ollama"
model = "gemma4-12b:latest"
defaults = { temperature = 0.8 }
[models."gemma4-12b".capabilities]
vision = false
thinking = true            # send think=false unless the caller asks for reasoning
json_schema = true         # Ollama format=<schema>
logprobs = false
max_input_tokens = 32768
max_output_tokens = 8192
vram_gb = 7.4
license = "Gemma Terms of Use"

[models."qwen2.5vl-7b"]
provider = "ollama"
model = "qwen2.5vl:7b"
[models."qwen2.5vl-7b".capabilities]
vision = true
image_patch_px = 28        # one prompt token per 28x28 pixels
json_schema = true
max_input_tokens = 32768
vram_gb = 6.0

[models."deepseek-r1-8b"]
provider = "ollama"
model = "deepseek-r1:8b"
[models."deepseek-r1-8b".capabilities]
vision = false
thinking = true
json_schema = true
max_input_tokens = 32768
vram_gb = 5.2
license = "MIT"

[models."nomic-embed-text"]
provider = "ollama"
model = "nomic-embed-text:latest"
kind = "embedding"
[models."nomic-embed-text".capabilities]
dimensions = 768
vram_gb = 0.3

[models.jev]
provider = "jev"
kind = "decision"
api_key_env = "TYPESAFE_API_KEY"   # API shape unverified (design/decisions.md D-019); base_url defaults to https://api.typesafe.ai/v1
[models.jev.capabilities]
questions = ["yes_no", "choice", "score"]
calibrated = true
price = { input_per_mtok = 0.042, output_per_mtok = 0.0 }

[models."gpt-4.1-mini"]
provider = "openai_compatible"
model = "gpt-4.1-mini"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
[models."gpt-4.1-mini".capabilities]
vision = true
json_schema = true
logprobs = true
max_input_tokens = 1047576
max_output_tokens = 32768
price = { input_per_mtok = 0.4, output_per_mtok = 1.6 }

[models."kokoro-82m"]
provider = "kokoro"              # extra `speech`; weights from Hugging Face on first use
model = "hexgrad/Kokoro-82M"
kind = "speech"
[models."kokoro-82m".capabilities]
# first letter: a = American, b = British English; second: f = female, m = male. The first is the default.
voices = ["af_heart", "am_michael", "af_bella", "am_fenrir", "bf_emma", "bm_george"]
vram_gb = 1.0
license = "Apache-2.0"
expressive = false                # accepts emotion / intensity and ignores them

[models.chatterbox]
provider = "chatterbox"          # extra `expressive`; weights (about 3 GB) from Hugging Face on first use
model = "ResembleAI/chatterbox"
kind = "speech"
defaults = { max_chunk_chars = 400, seed = 0 }
[models.chatterbox.capabilities]
# reference clips rendered by Kokoro's synthetic voices (scripts/make-expressive-voices.py), plus the
# voice bundled with the weights. The first is the default.
voices = ["warm_female", "warm_male", "british_female", "british_male", "chatterbox_default"]
expressive = true
vram_gb = 5.0
license = "MIT"
