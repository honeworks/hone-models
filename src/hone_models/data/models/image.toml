checked = 2026-10-11
[[models."qwen-image-2.1-turbo".guide.notes]]
about = "faces"
says = "hone-music-video gives a face shot the character's portrait instead of a full body, a rule adopted after Qwen-Image-Edit 2511 drew a close-up from a full body younger and softer; it was not measured separately on this model."
source = "hone-music-video/design/current.md §10.1; hone-music-video/design/decisions.md D-065"
checked = 2026-10-11
[[models."qwen-image-2.1-turbo".guide.notes]]
about = "hands"
says = "In two music videos' start frames, hands and limbs were mostly clean; the extra or melting limbs came from the video model that animated them."
source = "hone-music-video/experiments/weak-points.md §H"
checked = 2026-10-13
[[models."qwen-image-2.1-turbo".guide.notes]]
about = "people"
says = "Give each character one picture: six or ten full-body views read at 512 px drew each character twice (at 1024 px they did not), and a full body plus a drawn portrait per character added a third person in two of three seeds, although one body and one face crop per character showed no duplicates in an earlier test."
source = "hone-music-video/design/changes/0021-qwen-image-2.1-turbo.md; hone-music-video/design/decisions.md D-145"
checked = 2026-10-11
[[models."qwen-image-2.1-turbo".guide.notes]]
about = "people"
says = "Two characters described with nearly the same words get the same default face (twins in one scene); give characters who appear together different face traits (face shape, nose, brows, age)."
source = "hone-music-video/experiments/weak-points.md §22"
checked = 2026-10-13
[[models."qwen-image-2.1-turbo".guide.notes]]
about = "people"
says = "It draws difficult costumes and creatures from text more faithfully than z-image-turbo: on five hard characters its four-view sheets were all right (Zahhak's snakes in every view, the ox-headed mace), where Z-Image Turbo repeated or missed views and drew the mace as an axe."
source = "hone-music-video/design/changes/0021-qwen-image-2.1-turbo.md"
checked = 2026-10-11
[[models."qwen-image-2.1-turbo".guide.notes]]
about = "references"
says = "It has ten slots, but hone-music-video gives a scene at most six references (read at 768 px); ten read at 1024 px took over seven minutes."
source = "hone-music-video/design/changes/0021-qwen-image-2.1-turbo.md"
checked = 2026-10-11
[[models."qwen-image-2.1-turbo".guide.notes]]
about = "poses"
says = "It has no pose or depth control mode: a skeleton, depth or mannequin picture goes in as an ordinary reference, which works less exactly than a ControlNet (and its ControlNet does not fit 8 GB). The research suggests saying \"image N is only a pose guide: draw <character> in exactly the body pose of the mannequin in image N; do not copy its material or colour\" (not measured yet)."
source = "hone-music-video/experiments/research/README.md; hone-music-video/experiments/research/1-image-conditioning.md"
checked = 2026-10-13
[[models."qwen-image-2.1-turbo".guide.notes]]
about = "objects"
says = "The reference's side is copied: a laptop whose only picture showed the back of the lid was drawn with that side to the camera, typed on from behind. Give an object a picture of the side the picture needs."
source = "hone-music-video/experiments/issues.md §8"
checked = 2026-10-13
[[models."qwen-image-2.1-turbo".guide.notes]]
about = "places"
says = "A place drawn from words alone changes from picture to picture (a flat's window, lamps and desk moved between shots); give a recurring place a picture as a reference."
source = "hone-music-video/experiments/weak-points.md §21"
checked = 2026-10-13
[[models."qwen-image-2.1-turbo".guide.notes]]
about = "scenes"
says = "Two bodies in contact (embracing, grappling) are the weakest case for every method tried; show one body clearly and the other beside it."
source = "hone-music-video/experiments/research/README.md"
checked = 2026-10-13
[[models."qwen-image-2.1-turbo".guide.notes]]
about = "references"
says = "A picture outweighs the words: a pendant close-up given for a back view was painted on her back, even after two redos saying \"no necklace on her back\". Give a view only the pictures of what it shows."
source = "hone-music-video/design/decisions.md D-146"
checked = 2026-10-11
[[models."qwen-image-2.1-turbo".guide.notes]]
about = "references"
says = "References cost time, not memory: read at 1024 px a scene took 21 s with none, 63 s with 3, 215 s with 6 and 436 s with 10; read at 512 px, 24, 34 and 51 s, but with 6 or 10 at 512 px each character was drawn twice. With none it draws from the prompt alone."
source = "hone-music-video/design/changes/0021-qwen-image-2.1-turbo.md; hone-music-video/design/decisions.md D-140"
checked = 2026-10-11
[[models."qwen-image-2.1-turbo".guide.notes]]
about = "sizes"
says = "The workflow samples at the size asked for, not at the first reference's size: sampling at the reference's size reframed the picture (zoomed in, turned a back view to the camera)."
source = "hone-music-video/experiments/A3-qwen-latent-size/README.md"
checked = 2026-10-13
[[models."qwen-image-2.1-turbo".guide.notes]]
about = "sizes"
says = "1024x576 is below the model's trained size (about 1 to 1.6 MP); small faces and hands are likely to suffer most there (not measured yet)."
source = "hone-music-video/experiments/weak-points.md §17"
checked = 2026-10-13
[[models."qwen-image-2.1-turbo".guide.notes]]
about = "text"
says = "Its model card names text rendering as a strength: quote the words to render. Not tested here."
source = "https://huggingface.co/Qwen/Qwen-Image-2.1"
checked = 2026-09-29

