source = "https://huggingface.co/fal/Qwen-Image-Edit-2511-Multiple-Angles-LoRA"
[[models."qwen-image-edit-2511".guide.features]]
name = "multi-image composition"
how = "Place people or objects from several references into one scene, naming each reference."
input = "references"
examples = ["The magician bear is on the left, the alchemist bear is on the right, facing each other in the central park square."]
source = "https://huggingface.co/Qwen/Qwen-Image-Edit-2511"
[[models."qwen-image-edit-2511".guide.notes]]
about = "general"
says = "Write instructions as \"keep X, change Y\", naming what must not change; hone-frame kept a view edit to about 110 words and a composition to 150. With the camera phrase, \"wide shot\" fits a full figure and \"medium shot\" crops it."
source = "hone-frame/design/changes/0002-prompt-dialects.md; hone-frame/src/hone_frame/data/prompting.toml (before 0008)"
checked = 2026-10-02
[[models."qwen-image-edit-2511".guide.notes]]
about = "general"
says = "The camera phrase \"<sks> <direction> <height> <distance>\" goes at the very start and moves the camera only with lora_strength = 1.0. Directions are the camera's place around the subject (front view, front-right quarter view, right side view, back-right quarter view, back view, back-left quarter view, left side view, front-left quarter view); heights are low-angle shot, eye-level shot, elevated shot, high-angle shot; distances are close-up, medium shot, wide shot."
source = "https://huggingface.co/fal/Qwen-Image-Edit-2511-Multiple-Angles-LoRA"
checked = 2026-10-13
[[models."qwen-image-edit-2511".guide.notes]]
about = "general"
says = "The camera_angle input's choices end in \"medium shot\" (except close_up and wide), which crops a full figure; for a whole figure write the phrase yourself with \"wide shot\"."
source = "hone-models/src/hone_models/data/models/image.toml; hone-frame/design/changes/0002-prompt-dialects.md"
checked = 2026-10-13
[[models."qwen-image-edit-2511".guide.notes]]
about = "faces"
says = "For a close-up give a portrait (a large face) as image 1: from a full-body front view first, a close-up came out younger and softer than the character (seen with hone-music-video's 4-step workflow). hone-music-video also ends such prompts with \"keeps the face of image 1: same age, same features\"."
source = "hone-music-video/design/decisions.md D-065"
checked = 2026-10-10
[[models."qwen-image-edit-2511".guide.notes]]
about = "people"
says = "For a character's side and back views the Multiple-Angles LoRA made practically no difference (hone-music-video's 4-step workflow), and its back view merged a character's two shoulder snakes into one arc."
source = "hone-music-video/design/decisions.md D-136"
checked = 2026-10-11
[[models."qwen-image-edit-2511".guide.notes]]
about = "poses"
says = "Give the pose as a picture: a plain mannequin in the pose among the references is the route proven in this family (on FLUX.2 klein). Skeletons are unproven on 2511: a user reports that 2509's OpenPose obedience no longer works in 2511, and LoRAs (AnyPose, VNCCS PoseStudio) are said to restore it."
source = "hone-frame/design/research/prompting-findings.md; hone-music-video/experiments/research/1-image-conditioning.md"
checked = 2026-10-13
[[models."qwen-image-edit-2511".guide.notes]]
about = "objects"
says = "With the Multiple-Angles LoRA at strength 1 it turns an object for real (a true side profile of a mace) where FLUX.2 klein returned near-copies. A top view from a three-quarter picture did not work."
source = "hone-frame/design/changes/0007-quality-pipeline.md"
checked = 2026-10-04
[[models."qwen-image-edit-2511".guide.notes]]
about = "references"
says = "Call the references \"image 1\", \"image 2\", \"image 3\" and say what to keep from each; without references it draws from the prompt alone."
source = "hone-frame/src/hone_frame/data/hone-models.toml"
checked = 2026-10-02
[[models."qwen-image-edit-2511".guide.notes]]
about = "sizes"
says = "This 8-step workflow was run at 1024x1024 (about 2 minutes a picture, against about 8 minutes for 40 plain steps). 1024x576 was run only with hone-music-video's own 4-step workflow (about 141 s). The other declared sizes are allowed but unproven."
source = "hone-frame/src/hone_frame/data/hone-models.toml; hone-music-video/design/decisions.md D-030"
checked = 2026-10-10

