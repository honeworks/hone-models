[models."qwen-image-edit-2511"]
provider = "comfyui"
kind = "image"
[models."qwen-image-edit-2511".capabilities]
max_references = 3
license = "Apache-2.0"
commercial_use = true
# The Multiple-Angles LoRA's phrases (from its model card): "<sks> <azimuth> <elevation> <distance>".
[models."qwen-image-edit-2511".prompt_inputs.camera_angle]
place = "prepend"
choices = { front = "<sks> front view eye-level shot medium shot", left_45 = "<sks> front-left quarter view eye-level shot medium shot", right_45 = "<sks> front-right quarter view eye-level shot medium shot", left_side = "<sks> left side view eye-level shot medium shot", right_side = "<sks> right side view eye-level shot medium shot", back = "<sks> back view eye-level shot medium shot", back_left_45 = "<sks> back-left quarter view eye-level shot medium shot", back_right_45 = "<sks> back-right quarter view eye-level shot medium shot", low_angle = "<sks> front view low-angle shot medium shot", high_angle = "<sks> front view high-angle shot medium shot", close_up = "<sks> front view eye-level shot close-up", wide = "<sks> front view eye-level shot wide shot" }
[models."qwen-image-edit-2511".install]
source = "https://huggingface.co/Qwen/Qwen-Image-Edit-2511"
files = [
  { repo = "unsloth/Qwen-Image-Edit-2511-GGUF", file = "qwen-image-edit-2511-Q4_K_M.gguf", to = "unet" },
  { repo = "Comfy-Org/Qwen-Image_ComfyUI", file = "split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors", to = "text_encoders" },
  { repo = "Comfy-Org/Qwen-Image_ComfyUI", file = "split_files/vae/qwen_image_vae.safetensors", to = "vae" },
  { repo = "fal/Qwen-Image-Edit-2511-Multiple-Angles-LoRA", file = "qwen-image-edit-2511-multiple-angles-lora.safetensors", to = "loras" },
]
size_gb = 23.2
tier = 1
note = "strongest open editing model: keeps a character across shots; GGUF Q4 through the ComfyUI-GGUF node, plus the Multiple-Angles LoRA for character sheets"
[models."qwen-image-edit-2511".guide]
summary = "Edits or re-renders up to three reference images; keeps a character's identity; new camera angles with the Multiple-Angles LoRA."
prompt = "Plain sentences saying what to change; call the references 'image 1', 'image 2', 'image 3'."
inputs = { camera_angle = "a camera position of the Multiple-Angles LoRA; written at the start of the prompt" }
source = "https://huggingface.co/Qwen/Qwen-Image-Edit-2511"
checked = 2026-09-29
[[models."qwen-image-edit-2511".guide.features]]
name = "camera angle"
how = "The Multiple-Angles LoRA moves the camera when the prompt holds one of its phrases (8 azimuths x 4 elevations x 3 distances); the camera_angle input writes one."
input = "camera_angle"
examples = ["<sks> front-left quarter view eye-level shot medium shot", "<sks> back view low-angle shot wide shot", "<sks> right side view high-angle shot close-up"]
source = "https://huggingface.co/fal/Qwen-Image-Edit-2511-Multiple-Angles-LoRA"
[[models."qwen-image-edit-2511".guide.features]]
name = "multi-image composition"
how = "Place people or objects from several references into one scene, naming each reference."
input = "references"
examples = ["The magician bear is on the left, the alchemist bear is on the right, facing each other in the central park square."]
source = "https://huggingface.co/Qwen/Qwen-Image-Edit-2511"

